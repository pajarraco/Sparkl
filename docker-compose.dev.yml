# SPARKL_STACK lets a second worktree run its own stack (own containers
# and volumes) next to the main one; leave it unset for the defaults.
name: ${SPARKL_STACK:-sparkl-dev}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${SPARKL_STACK:-sparkl}-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: sparkl
      POSTGRES_PASSWORD: sparkl
      POSTGRES_DB: sparkl
    volumes:
      - sparkl-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparkl -d sparkl"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ${SPARKL_STACK:-sparkl}-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - sparkl-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO deleted minio/minio from Docker Hub (Sep 2026); Chainguard's
    # rebuild tracks the last community release. No shell in this image, so
    # no container healthcheck — the API retries S3 calls instead.
    image: cgr.dev/chainguard/minio:latest
    container_name: ${SPARKL_STACK:-sparkl}-minio
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: sparkl
      MINIO_ROOT_PASSWORD: sparkl1234
    volumes:
      - sparkl-miniodata:/data
    command: server /data --console-address ":9001"

volumes:
  sparkl-pgdata:
  sparkl-redisdata:
  sparkl-miniodata:
