name: sparkl-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: sparkl-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sparkl
      POSTGRES_PASSWORD: sparkl
      POSTGRES_DB: sparkl
    volumes:
      - sparkl-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparkl -d sparkl"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sparkl-redis
    ports:
      - "6379:6379"
    volumes:
      - sparkl-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO deleted minio/minio from Docker Hub (Sep 2026); Chainguard's
    # rebuild tracks the last community release. No shell in this image, so
    # no container healthcheck — the API retries S3 calls instead.
    image: cgr.dev/chainguard/minio:latest
    container_name: sparkl-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: sparkl
      MINIO_ROOT_PASSWORD: sparkl1234
    volumes:
      - sparkl-miniodata:/data
    command: server /data --console-address ":9001"

volumes:
  sparkl-pgdata:
  sparkl-redisdata:
  sparkl-miniodata:
